server {
    # Cloud Run injects PORT (default 8080) and expects the container to
    # listen on it; hardcoded here since nginx.conf can't read env vars
    # without an envsubst step - keep this in sync with the Dockerfile's
    # EXPOSE/ENV PORT and the deploy script's --port if either ever changes.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router-dom): let unknown paths fall through
    # to index.html instead of 404ing, so deep links and refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
