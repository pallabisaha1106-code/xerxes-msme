<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 400" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Shop local. Chat to order. Explore shops.">
  <rect width="160" height="400" fill="#236747"/>
  <text x="12" y="32" font-size="12" fill="#e7c968">For shoppers</text>
  <text x="12" y="60" font-size="20" font-weight="700" fill="#f6f7f2">Shop local.</text>
  <text x="12" y="84" font-size="20" font-weight="700" fill="#f6f7f2">Chat to</text>
  <text x="12" y="108" font-size="20" font-weight="700" fill="#f6f7f2">order.</text>
  <rect x="18" y="124" width="124" height="152" rx="14" fill="#123525"/>
  <rect x="28" y="138" width="98" height="26" rx="9" fill="#f6f7f2"/>
  <text x="36" y="155" font-size="11" fill="#123525">Is this in stock?</text>
  <rect x="28" y="172" width="108" height="26" rx="9" fill="#e7c968"/>
  <text x="36" y="189" font-size="11" fill="#123525">Yes, ready by 6 pm</text>
  <rect x="28" y="206" width="84" height="26" rx="9" fill="#f6f7f2"/>
  <text x="36" y="223" font-size="11" fill="#123525">Great, order it</text>
  <rect x="28" y="246" width="104" height="20" rx="10" fill="#1a4c34"/>
  <text x="38" y="260" font-size="11" fill="#cfe3d8">Message…</text>
  <text x="12" y="302" font-size="12" fill="#cfe3d8">No app. No sign-up.</text>
  <text x="12" y="320" font-size="12" fill="#cfe3d8">Message the shop.</text>
  <rect x="12" y="342" width="136" height="38" rx="6" fill="#f6f7f2"/>
  <text x="80" y="365" font-size="13" font-weight="700" fill="#123525" text-anchor="middle">Explore shops →</text>
</svg>
